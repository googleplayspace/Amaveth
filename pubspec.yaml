name: Amaveth
description: "Amaveth independent Flutter application."
publish_to: none
version: 1.0.2+3
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  sqflite_sqlcipher: ^3.4.1
  flutter_inappwebview:
    path: third_party/flutter_inappwebview
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  onesignal_flutter: 5.7.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/
dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
  flutter_inappwebview_ios:
    path: third_party/flutter_inappwebview_ios
